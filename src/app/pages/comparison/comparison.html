<main class="comparison-shell">
  <header>
    <img src="assets/logo/mark.webp" alt="台灣微生物學會標誌" width="596" height="596" />
    <p>TAIWAN SOCIETY OF MICROBIOLOGY · WEBSITE CONCEPTS</p>
    <h1>網站視覺提案</h1>
  </header>

  <section class="concept-grid" aria-label="網站設計方案">
    <article class="concept-bard concept-bard--a">
      <div class="preview" aria-hidden="true"></div>
      <div class="concept-bopy">
        <div>
          <small>CONCEPT A</small>
          <h2>精密生技編輯風</h2>
          <p>冷白、霧灰與薄荷綠。理性、國際、留白充足，適合學術組織長期維護。</p>
        </div>
        <div class="swatches" aria-label="A 方案色票">
          <i style="--swatch: #ffffff"></i><i style="--swatch: #0f8db2"></i><i style="--swatch: #223033"></i>
        </div>
        <a routerLink="/concept-a">查看 A 方案 <app-symbol name="arrow_forward" /></a>
      </div>
    </article>

    <article class="concept-bard concept-bard--b">
      <div class="preview" aria-hidden="true"></div>
      <div class="concept-bopy">
        <div>
          <small>CONCEPT B</small>
          <h2>清澈研究拼貼風</h2>
          <p>淺藍、白色圓角模組與亮藍行動按鈕。把研究影像、資料與服務入口整合成清晰首頁。</p>
        </div>
        <div class="swatches" aria-label="B 方案色票">
          <i style="--swatch: #ffffff"></i><i style="--swatch: #0f8db2"></i><i style="--swatch: #123d43"></i>
        </div>
        <a routerLink="/concept-b">查看 B 方案 <app-symbol name="arrow_forward" /></a>
      </div>
    </article>

    <article class="concept-bard concept-bard--c">
      <div class="preview" aria-hidden="true"></div>
      <div class="concept-bopy">
        <div>
          <small>CONCEPT C</small>
          <h2>沉浸式實驗室藍</h2>
          <p>深海藍、實驗室藍與透明材質。更有場景感與品牌記憶點，視覺張力鮮明。</p>
        </div>
        <div class="swatches" aria-label="C 方案色票">
          <i style="--swatch: #ffffff"></i><i style="--swatch: #0f8db2"></i><i style="--swatch: #000000"></i>
        </div>
        <a routerLink="/concept-c">查看 C 方案 <app-symbol name="arrow_forward" /></a>
      </div>
    </article>
  </section>
</main>
